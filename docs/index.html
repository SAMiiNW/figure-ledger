<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure Ledger</title><style>
:root{--black:#0d0e0d;--panel:#181a18;--grid:#383b36;--lime:#d9ff39;--silver:#d7d9d1;--blue:#496fff}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--silver);font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.machine{min-height:100vh;display:grid;grid-template-columns:82px 1fr}.rail{border-right:1px solid var(--grid);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 0;position:sticky;top:0;height:100vh}.rail strong{writing-mode:vertical-rl;transform:rotate(180deg);font-size:18px;letter-spacing:.08em;color:white}.rail span{writing-mode:vertical-rl;font:700 10px ui-monospace,monospace;letter-spacing:.16em;color:#73776f}.rail button{writing-mode:vertical-rl;transform:rotate(180deg);border:0;background:var(--lime);padding:14px 10px;font:900 10px ui-monospace,monospace}.workspace{padding:24px 3vw 60px}.display{border:1px solid var(--grid);background:#111210;display:grid;grid-template-columns:220px 1fr;min-height:210px}.display-meta{padding:24px;border-right:1px solid var(--grid);font:11px/1.6 ui-monospace,monospace}.display-meta b{color:var(--lime);display:block;margin-bottom:20px}.display-meta p{color:#888}.readout{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;padding:25px 3vw}.digit{font:900 clamp(3.8rem,9vw,9rem)/.8 ui-monospace,monospace;color:white;letter-spacing:-.1em}.digit.result{color:var(--lime)}.sign{font:900 2rem ui-monospace,monospace;padding:0 16px 10px;color:#72766e}.workbench{display:grid;grid-template-columns:1.05fr 1.25fr .7fr;border:1px solid var(--grid);border-top:0}.bay{padding:24px;border-right:1px solid var(--grid)}.bay:last-child{border-right:0}.bay h2{margin:0 0 22px;font:800 10px ui-monospace,monospace;letter-spacing:.16em;color:var(--lime)}.field{display:grid;gap:6px;margin:13px 0}.field label{font:700 9px ui-monospace,monospace;color:#8d9189;letter-spacing:.09em}.field input,.field select,.field textarea{width:100%;padding:12px;background:#0d0e0d;color:white;border:1px solid #4c5049}.ledger-row{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;border-top:1px solid var(--grid);padding:12px 0}.ledger-row .n{font:900 20px ui-monospace,monospace;color:#656960}.operator{background:var(--silver);color:var(--black)}.operator h2{color:var(--black)}.operator .field label{color:#444}.operator .field input,.operator .field select{background:white;color:black;border-color:black}.keys{display:grid;gap:8px;margin-top:22px}.keys button{border:1px solid var(--black);padding:14px 8px;background:transparent;font:900 10px ui-monospace,monospace}.keys .open{background:var(--black);color:white}.keys .verify{background:var(--blue);border-color:var(--blue);color:white}.keys .demo{background:var(--lime)}.receipt{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--grid);border-top:0}.receipt-head{padding:24px;border-right:1px solid var(--grid)}.receipt-head h2{font:800 10px ui-monospace,monospace;letter-spacing:.16em;color:var(--lime)}.status{font:11px/1.5 ui-monospace,monospace;color:#9ca8ff}.receipt button{border:1px solid #6d716a;color:white;background:transparent;padding:9px 11px;font:800 9px ui-monospace,monospace}pre{margin:0;padding:24px;min-height:190px;white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;color:var(--lime);background:#050605}@media(max-width:900px){.machine{grid-template-columns:1fr}.rail{position:static;width:auto;height:auto;flex-direction:row;padding:14px 20px;border-right:0;border-bottom:1px solid var(--grid)}.rail strong,.rail span,.rail button{writing-mode:initial;transform:none}.display{grid-template-columns:1fr}.display-meta{border-right:0;border-bottom:1px solid var(--grid)}.readout{grid-template-columns:1fr auto 1fr auto 1fr}.digit{font-size:clamp(2.8rem,15vw,6rem)}.workbench{grid-template-columns:1fr}.bay{border-right:0;border-bottom:1px solid var(--grid)}.receipt{grid-template-columns:1fr}.receipt-head{border-right:0;border-bottom:1px solid var(--grid)}}
</style></head><body><main class="machine">
<aside class="rail"><strong>FIGURE LEDGER</strong><span>SOURCE-BOUND ARITHMETIC</span><button id="connect">CONNECT</button></aside><div class="workspace">
<section class="display"><div class="display-meta"><b>LIVE WORKSHEET / STUDIONET</b><p>Validators extract the integers. The contract performs the arithmetic. Every result keeps its source trail.</p></div><div class="readout"><span class="digit" id="a">120</span><span class="sign">+</span><span class="digit" id="b">80</span><span class="sign">=</span><span class="digit result" id="result">200</span></div></section>
<section class="workbench"><div class="bay evidence"><h2>01 / SOURCE DRAWER</h2><div class="field"><label>EVIDENCE URLS — ONE PER LINE</label><textarea id="sources" rows="12">https://raw.githubusercontent.com/SAMiiNW/figure-ledger/main/docs/evidence/north-count.md
https://cdn.jsdelivr.net/gh/SAMiiNW/figure-ledger@main/docs/evidence/south-count.md</textarea></div></div>
<div class="bay"><h2>02 / LEDGER CARD</h2><div class="field"><label>SHEET ID</label><input id="sid" value="FL-WEB"></div><div class="field"><label>SHEET TITLE</label><input id="title" value="September service total"></div><div class="ledger-row"><span class="n">A</span><div class="field"><label>FIRST FIGURE LABEL</label><input id="la" value="North completed requests"></div></div><div class="ledger-row"><span class="n">B</span><div class="field"><label>SECOND FIGURE LABEL</label><input id="lb" value="South completed requests"></div></div><div class="field"><label>AUDITOR WALLET</label><input id="auditor"></div></div>
<div class="bay operator"><h2>03 / OPERATOR</h2><div class="field"><label>OPERATION</label><select id="op"><option>SUM</option><option>DIFFERENCE</option><option>RATIO_BPS</option></select></div><div class="field"><label>CLAIMED RESULT</label><input id="claim" type="number" value="200"></div><div class="keys"><button class="open" id="open">OPEN LEDGER</button><button class="verify" id="verify">VERIFY SOURCES</button><button class="demo" id="demo">RUN 120 + 80</button></div></div></section>
<section class="receipt"><div class="receipt-head"><h2>FINAL RECEIPT</h2><p class="status" id="status">STUDIONET / READY</p><button id="load">LOAD BY SHEET ID</button></div><pre id="output">No sheet loaded.</pre></section></div></main>
<script type="module">
import{createAccount,createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const ADDRESS='0x2c5Aaa83f41d008b6370B4DE7f4b4F30fb6Ea5d4',ENDPOINT='https://studio.genlayer.com/api',$=s=>document.querySelector(s);let client;const out=x=>$('#output').textContent=JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v,2),status=x=>$('#status').textContent=x;async function connect(){if(!window.ethereum)throw Error('Install MetaMask or Rabby.');const[a]=await ethereum.request({method:'eth_requestAccounts'});client=createClient({chain:studionet,endpoint:ENDPOINT,account:a,provider:ethereum});status('WALLET CONNECTED')}async function send(c,name,args){status('SUBMITTED '+name);const hash=await c.writeContract({address:ADDRESS,functionName:name,args,value:0n});status('WAITING FOR FINALIZED '+hash);const r=await c.waitForTransactionReceipt({hash,status:'FINALIZED',retries:180,interval:5000});if(String(r.result_name??r.resultName??'').toUpperCase()!=='MAJORITY_AGREE')throw Error('FINALIZED WITHOUT AGREEMENT');return hash}async function read(c=client,id=$('#sid').value.trim()){const x=await c.readContract({address:ADDRESS,functionName:'get_sheet',args:[id]});out(x);if(x.values?.length){$('#a').textContent=x.values[0];$('#b').textContent=x.values[1];$('#result').textContent=x.computed_result}return x}$('#connect').onclick=()=>connect().catch(e=>out({error:e.message}));$('#open').onclick=async()=>{try{if(!client)await connect();await send(client,'open_sheet',[$('#sid').value,$('#auditor').value,$('#title').value,[$('#la').value,$('#lb').value],$('#op').value,Number($('#claim').value)]);await read()}catch(e){out({error:e.message})}};$('#verify').onclick=async()=>{try{if(!client)await connect();await send(client,'verify_sheet',[$('#sid').value,$('#sources').value.split('\n').filter(Boolean)]);await read()}catch(e){out({error:e.message})}};$('#load').onclick=()=>read().catch(e=>out({error:e.message}));$('#demo').onclick=async()=>{const owner=createAccount(),auditor=createAccount(),oc=createClient({chain:studionet,endpoint:ENDPOINT,account:owner}),ac=createClient({chain:studionet,endpoint:ENDPOINT,account:auditor}),id='FL-DEMO-'+Date.now(),tx={};$('#sid').value=id;try{tx.open=await send(oc,'open_sheet',[id,auditor.address,'September service total',['North completed requests','South completed requests'],'SUM',200]);tx.verify=await send(ac,'verify_sheet',[id,$('#sources').value.split('\n').filter(Boolean)]);const x=await read(oc,id);if(x.state!=='MATCH'||Number(x.computed_result)!==200)throw Error('EXPECTED MATCH 200');status('DEMO FINALIZED');out({sheetId:id,state:x.state,values:x.values,computed:x.computed_result,transactions:tx})}catch(e){out({error:e.message,transactions:tx})}};
</script></body></html>
